<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="operator-ui-version" content="v-final-dynamic-responsive">
<title>Operator Input</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#f5f7fa);
  --card:var(--tg-theme-secondary-bg-color,#fff);
  --text:var(--tg-theme-text-color,#17202a);
  --hint:var(--tg-theme-hint-color,#718096);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btntext:var(--tg-theme-button-text-color,#fff);
  --ok:#20a464;--warn:#e67e00;--bad:#d93025;
  --key-bg:var(--tg-theme-secondary-bg-color,#ffffff);
  --key-border:rgba(100,116,139,.12);
  --shadow:0 2px 8px rgba(15,23,42,.07);
  --shadow-press:0 1px 2px rgba(15,23,42,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
body{overflow-x:hidden;overflow-y:auto}
button{font:inherit;-webkit-touch-callout:none;user-select:none}
.app{width:100%;max-width:520px;margin:0 auto;min-height:100dvh;
  padding:8px 14px calc(14px + env(safe-area-inset-bottom))}
.head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:7px;min-height:44px}
.head button{border:0;background:transparent;color:var(--btn);font-size:14px;font-weight:800;padding:8px 4px;border-radius:10px}
.head button:active{background:rgba(128,128,128,.12);transform:scale(.96)}
.head .cancel{color:var(--bad)}
.title{text-align:center;font-weight:850;font-size:16px;line-height:19px}
.sub{text-align:center;color:var(--hint);font-size:11px;margin-top:2px}
.progress{height:4px;background:rgba(128,128,128,.16);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.progress>i{display:block;height:100%;width:0;background:var(--btn);transition:width .22s ease}
.meta{display:flex;flex-wrap:wrap;gap:5px 9px;background:var(--card);border-radius:14px;
  padding:8px 11px;margin-bottom:11px;font-size:10px;color:var(--hint);box-shadow:var(--shadow)}
.meta b{color:var(--text)}
#entry{display:flex!important;flex-direction:column!important;gap:0!important}
.parameter-card{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  height:84px!important;min-height:84px!important;padding:11px 13px!important;
  margin:0 0 12px!important;background:var(--card);border-radius:18px!important;box-shadow:var(--shadow)}
.param-main{min-width:0}
.label{font-size:17px;font-weight:850;line-height:1.18;overflow-wrap:anywhere}
.unit{font-size:10px;color:var(--hint);margin-top:4px}
.std{font-size:10px;margin-top:5px}
.state{font-size:11px;font-weight:800;min-height:13px;margin-top:3px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.param-person{min-width:82px;max-width:132px;padding-left:12px;margin-left:10px;
  border-left:1px solid rgba(128,128,128,.18);text-align:right}
.operator-name{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.operator-shift{margin-top:3px;font-size:10px;color:var(--hint);white-space:nowrap}
.display{width:100%;height:62px!important;min-height:62px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border-radius:18px;font-size:36px;font-weight:850;letter-spacing:.5px;
  margin:0 0 12px!important;box-shadow:var(--shadow)}
.empty{color:var(--hint);font-weight:500}
.keys{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(5,52px);grid-auto-rows:52px;gap:9px 10px;margin:0 0 12px!important}
.key,.key.wide{width:100%;height:52px!important;min-height:52px!important;max-height:52px!important;
  border:1px solid var(--key-border);border-radius:15px!important;background:var(--key-bg);color:var(--text);
  font-size:25px;font-weight:750;box-shadow:var(--shadow);
  transition:transform .06s ease,box-shadow .06s ease,filter .06s ease,background-color .06s ease;
  touch-action:manipulation;cursor:pointer}
.key.small{font-size:17px;font-weight:800}
.key.wide{grid-column:1 / -1}
.key:active,.key.pressed{transform:translateY(2px) scale(.975);box-shadow:var(--shadow-press);
  filter:brightness(.91)}
.key[data-k="clear"]{font-size:15px}
.draft-status{min-height:13px;text-align:center;color:var(--hint);font-size:10px;line-height:13px;margin:0 0 7px!important}
.draft-status.saved{color:var(--ok)}
.note{min-height:13px;height:auto;text-align:center;color:var(--hint);font-size:10px;line-height:13px;margin:0 0 4px!important}
.nav-buttons{display:grid;grid-template-columns:1fr 1.25fr;gap:9px}
.nav-btn{height:44px!important;min-height:44px;border:0;border-radius:14px;font-size:14px;font-weight:850;
  transition:transform .06s ease,filter .06s ease}
.nav-btn.prev{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.nav-btn.next{background:var(--btn);color:var(--btntext);box-shadow:0 3px 9px rgba(36,129,204,.22)}
.nav-btn:disabled{opacity:.42}
.nav-btn:active{transform:translateY(2px) scale(.985);filter:brightness(.92)}
.review{display:none;min-height:0;overflow:visible;padding-top:7px}
.review.show{display:block}
.list{background:var(--card);border-radius:16px;padding:0 12px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;
  border-bottom:1px solid rgba(128,128,128,.16);transition:background .08s ease}
.row:last-child{border:0}.row:active{background:rgba(128,128,128,.08)}
.name{min-width:0}.name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.name span{font-size:10px;color:var(--hint)}.val{font-weight:850}
.badge{font-size:10px;font-weight:850;min-width:45px;text-align:right}
.ready{color:var(--ok)}.check{color:var(--warn)}.missing{color:var(--bad)}
@media(max-width:380px){
  .app{padding-left:12px;padding-right:12px}
  .parameter-card{height:80px!important;min-height:80px!important;margin-bottom:10px!important}
  .label{font-size:16px}.param-person{min-width:76px;padding-left:10px}
  .display{height:58px!important;min-height:58px;margin-bottom:10px!important;font-size:34px}
  .keys{grid-template-rows:repeat(5,49px);grid-auto-rows:49px;gap:8px}
  .key,.key.wide{height:49px!important;min-height:49px!important;max-height:49px!important}
}
@media(min-width:600px){.app{padding-left:18px;padding-right:18px}}
@media(max-height:620px){
  .app{padding-top:5px}
  .parameter-card{height:74px!important;min-height:74px!important;margin-bottom:8px!important}
  .display{height:52px!important;min-height:52px;margin-bottom:8px!important}
  .keys{grid-template-rows:repeat(5,44px);grid-auto-rows:44px;gap:7px 9px;margin-bottom:8px!important}
  .key,.key.wide{height:44px!important;min-height:44px!important;max-height:44px!important}
  .nav-btn{height:40px!important;min-height:40px}
}
@media(min-height:900px){
  .parameter-card{height:88px!important;min-height:88px!important}
  .display{height:66px!important;min-height:66px}
  .keys{grid-template-rows:repeat(5,56px);grid-auto-rows:56px;gap:10px}
  .key,.key.wide{height:56px!important;min-height:56px!important;max-height:56px!important}
}
@media(orientation:landscape){
  .app{max-width:700px}
  .parameter-card{height:70px!important;min-height:70px!important;margin-bottom:8px!important}
  .display{height:50px!important;min-height:50px;margin-bottom:8px!important}
  .keys{grid-template-rows:repeat(5,42px);grid-auto-rows:42px;gap:6px 9px;margin-bottom:8px!important}
  .key,.key.wide{height:42px!important;min-height:42px!important;max-height:42px!important}
}

/* Browser test indicator */
.test-badge{
  display:none;
  position:sticky;top:0;z-index:20;
  width:max-content;margin:0 auto 5px;
  padding:4px 9px;border-radius:999px;
  background:rgba(230,126,0,.12);color:var(--warn);
  font-size:10px;font-weight:850;letter-spacing:.2px;
}
</style>
</head>
<body>
<div class="app">

  <div class="test-badge" id="testBadge">🧪 MODE TEST — Browser</div>
  <div class="head"><button class="cancel" id="cancel">❌ Batal</button><div><div class="title" id="title">Input Operator</div><div class="sub" id="sub">1 / 1</div></div><button id="reviewBtn">📋 Ringkas</button></div>
  <div class="progress"><i id="bar"></i></div>
  <div class="meta" id="meta"></div>

  <section id="entry">
    <div class="card parameter-card">
  <div class="param-main">
    <div class="label" id="label">Nilai</div>
    <div class="unit" id="unit"></div>
    <div class="std" id="std"></div>
    <div class="state" id="state"></div>
  </div>
  <div class="param-person">
    <div class="operator-name" id="operatorName">-</div>
    <div class="operator-shift" id="operatorShift">Shift -</div>
  </div>
</div>
    <div class="display empty" id="display">0</div>
    <div class="keys">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key small" data-k="sign">±</button><button class="key" data-k="0">0</button><button class="key small" data-k="dot">,</button>
      <button class="key small wide" data-k="back">⌫ Hapus</button>
      <button class="key small wide" data-k="clear">↺ Hapus Semua</button>
    </div>
    <div class="note" id="note"></div>
    <div class="draft-status" id="draftStatus"></div>
    <div class="nav-buttons">
      <button type="button" class="nav-btn prev" id="prevBtn">‹ Kembali</button>
      <button type="button" class="nav-btn next" id="nextBtn">Lanjut ›</button>
    </div>
  </section>

  <section class="review" id="review"><div class="list" id="list"></div></section>
</div>
<script>
(()=>{"use strict";
const tg=window.Telegram?.WebApp||null, qs=new URLSearchParams(location.search);

/* STANDALONE TEST MODE
   Production Telegram variables/payloads remain unchanged.
   When opened outside Telegram, sample params/meta are supplied only for testing.
*/
const TEST_MODE=!tg;
if(TEST_MODE){
  const testParams=[
    {key:"ph",label:"pH Karbonatasi",satuan:"pH",stdMin:6.5,stdMax:7.5,stdText:"Standar: 6.5 – 7.5 pH"},
    {key:"suhu",label:"Suhu",satuan:"°C",stdMin:28,stdMax:35,stdText:"Standar: 28 – 35 °C"},
    {key:"tekanan",label:"Tekanan",satuan:"bar",stdMin:1.5,stdMax:3,stdText:"Standar: 1.5 – 3 bar"},
    {key:"flow",label:"Flow Rate",satuan:"L/min",stdMin:10,stdMax:25,stdText:"Standar: 10 – 25 L/min"},
    {key:"co2",label:"CO₂",satuan:"%",stdMin:15,stdMax:25,stdText:"Standar: 15 – 25 %"}
  ];
  const testMeta={
    tanggal:new Date().toLocaleDateString("id-ID"),
    jam:new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}),
    shift:"1",grup:"Grup 1",nama_operator:"TEST OPERATOR",
    supervisor:"TEST SPV",shift_chief:"TEST SHIFT CHIEF"
  };
  if(!qs.get("params")) params=testParams;
  if(!qs.get("meta")) meta=testMeta;
}
const parse=(s,f)=>{try{return JSON.parse(s||"")||f}catch(e){return f}};
let params=parse(qs.get("params"),[]), meta=parse(qs.get("meta"),{});
params=Array.isArray(params)?params.map(p=>({key:String(p.key||""),label:String(p.label||p.key||"Nilai"),satuan:String(p.satuan||""),stdMin:p.stdMin??p.min??null,stdMax:p.stdMax??p.max??null,stdText:String(p.stdText||p.std||"")})).filter(p=>p.key):[];
if(!params.length)params=[{key:"nilai",label:"Nilai",satuan:""}];
let i=0, vals=params.map(()=>""), neg=params.map(()=>false), review=false;
const $=x=>document.getElementById(x), display=$("display"), label=$("label"), unit=$("unit"), std=$("std"), state=$("state");
const operatorName=$("operatorName"), operatorShift=$("operatorShift"), prevBtn=$("prevBtn"), nextBtn=$("nextBtn");
if(operatorName)operatorName.textContent=meta.nama_operator||meta.operator||"-";
if(operatorShift)operatorShift.textContent=meta.shift?("Shift "+String(meta.shift).replace(/^Shift\s*/i,"")):"Shift -";
if(tg){tg.ready();tg.expand()}
function h(t){try{tg?.HapticFeedback?.impactOccurred(t||"light")}catch(e){}}
const draftStatus=$("draftStatus");
const draftKey=(()=>{
 const stable={params:params.map(p=>p.key),tanggal:meta.tanggal||"",jam:meta.jam||"",shift:meta.shift||"",grup:meta.grup||"",operator:meta.nama_operator||meta.operator||""};
 let s="operatorDraft:v2:"+JSON.stringify(stable),h=0;for(let k=0;k<s.length;k++)h=((h<<5)-h+s.charCodeAt(k))|0;
 return "operatorDraft:v2:"+Math.abs(h);
})();
function saveDraft(){
 try{localStorage.setItem(draftKey,JSON.stringify({vals,neg,i,ts:Date.now()}));
 if(draftStatus){draftStatus.className="draft-status saved";draftStatus.textContent="✓ Draft tersimpan otomatis"}}catch(e){}
}
function restoreDraft(){
 try{const d=JSON.parse(localStorage.getItem(draftKey)||"null");
 if(!d||!Array.isArray(d.vals)||d.vals.length!==params.length||!d.vals.some(v=>String(v||"").length))return;
 for(let j=0;j<params.length;j++){vals[j]=String(d.vals[j]||"");neg[j]=!!(d.neg&&d.neg[j])}
 if(Number.isInteger(d.i))i=Math.max(0,Math.min(params.length-1,d.i));
 if(draftStatus){draftStatus.className="draft-status saved";draftStatus.textContent="↻ Draft terakhir dipulihkan"}
 }catch(e){}
}
function clearDraft(){try{localStorage.removeItem(draftKey)}catch(e){}}
function raw(j=i){return (neg[j]?"-":"")+vals[j]}
function num(j=i){if(!vals[j])return null;const n=parseFloat(raw(j));return Number.isFinite(n)?n:null}
function renderMeta(){const keys=[["tanggal","Tanggal"],["jam","Jam"],["shift","Shift"],["grup","Grup"],["nama_operator","Operator"],["supervisor","SPV"],["shift_chief","Shift Chief"]];$("meta").innerHTML=keys.filter(x=>meta[x[0]]).map(x=>"<span>"+x[1]+": <b>"+String(meta[x[0]])+"</b></span>").join("")}
function render(){
 if(review)return;
 const p=params[i], n=num(); label.textContent=p.label;unit.textContent=p.satuan?"Satuan: "+p.satuan:"";
 $("sub").textContent=(i+1)+" / "+params.length;$("bar").style.width=((i+1)/params.length*100)+"%";
 display.textContent=vals[i]?raw():"0";display.classList.toggle("empty",!vals[i]);
 std.textContent=p.stdText||((p.stdMin!=null&&p.stdMax!=null)?("Standar: "+p.stdMin+" – "+p.stdMax+(p.satuan?" "+p.satuan:"")):"");
state.textContent="";state.className="state";
if(n!==null&&p.stdMin!=null&&p.stdMax!=null){ const lo=Number(p.stdMin),hi=Number(p.stdMax); if(Number.isFinite(lo)&&Number.isFinite(hi)&&(n<lo||n>hi)){ state.className="state warn";state.textContent="⚠ Di luar standar — tetap bisa disimpan"; }}
 $("note").textContent=params.length>1?"Nilai tersimpan saat berpindah parameter.":"Isi nilai, lalu Review & Kirim.";
if(prevBtn){prevBtn.disabled=i===0;}
if(nextBtn){nextBtn.textContent=i===params.length-1?"Review & Kirim":"Lanjut ›";}
}
function next(){if(num()===null){state.className="state bad";state.textContent="❌ Nilai belum diisi";h("rigid");return}if(i<params.length-1){i++;saveDraft();render()}else{saveDraft();showReview(true)}}
function back(){if(review){showReview(false);return}if(i){i--;render()}}
function showReview(on){review=on;$("entry").style.display=on?"none":"block";$("review").classList.toggle("show",on);$("title").textContent=on?"Periksa Laporan":"Input Operator";$("reviewBtn").textContent=on?"✏️ Edit":"📋 Ringkas";
if(on){renderList();tg?.MainButton?.setText("✅ Kirim Semua");tg?.MainButton?.show();tg?.MainButton?.enable()}else{tg?.MainButton?.hide();render()}}
function renderList(){const list=$("list");list.innerHTML="";params.forEach((p,j)=>{const n=num(j),r=document.createElement("div");r.className="row";r.innerHTML='<div class="name"><b>'+(j+1)+". "+p.label+'</b><span>'+p.satuan+'</span></div><div class="val">'+(n===null?"-":n)+'</div><div class="badge '+(n===null?"missing":"ready")+'">'+(n===null?"KOSONG":"SIAP")+"</div>";r.onclick=()=>{i=j;showReview(false)};list.appendChild(r)})}
function finish(){
  for(let j=0;j<params.length;j++)if(num(j)===null){i=j;showReview(false);h("rigid");return}
  const values={};params.forEach((p,j)=>values[p.key]=String(num(j)));
  if(TEST_MODE){
    if(draftStatus){draftStatus.className="draft-status saved";draftStatus.textContent="✓ TEST berhasil — data siap dikirim ke Telegram"}
    console.log("TEST MODE submit payload:",JSON.stringify({action:"submit",values}));
    return;
  }
  clearDraft();h("medium");tg?.sendData(JSON.stringify({action:"submit",values}))
}
$("cancel").onclick=()=>{
  if(TEST_MODE){
    vals=params.map(()=>""),neg=params.map(()=>false),i=0,review=false;
    clearDraft();render();showReview(false);
    if(draftStatus){draftStatus.className="draft-status";draftStatus.textContent="↺ Input test direset"}
    return;
  }
  tg?.sendData(JSON.stringify({action:"cancel"}));
};
$("reviewBtn").onclick=()=>showReview(!review);
prevBtn?.addEventListener("click",back);
nextBtn?.addEventListener("click",next);
document.querySelectorAll(".key").forEach(b=>{
  const press=()=>{b.classList.add("pressed");clearTimeout(b._pressTimer);b._pressTimer=setTimeout(()=>b.classList.remove("pressed"),90)};
  b.addEventListener("pointerdown",press,{passive:true});
  b.addEventListener("pointerup",()=>b.classList.remove("pressed"),{passive:true});
  b.addEventListener("pointercancel",()=>b.classList.remove("pressed"),{passive:true});
});
document.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="back"){vals[i]=vals[i].slice(0,-1);if(!vals[i])neg[i]=false}else if(k==="clear"){vals[i]="";neg[i]=false}else if(k==="dot"){if(!vals[i].includes("."))vals[i]=vals[i]||"0",vals[i]+="."}else if(k==="sign"){if(vals[i])neg[i]=!neg[i]}else if(vals[i].length<10){vals[i]=vals[i]==="0"?k:vals[i]+k}h();saveDraft();render()});
tg?.MainButton?.onClick(()=>{if(review)finish();});tg?.BackButton?.onClick(back);
window.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();review?finish():next()}else if(e.key==="Backspace"){e.preventDefault();vals[i]=vals[i].slice(0,-1);if(!vals[i])neg[i]=false;saveDraft();render()}else if(/^\d$/.test(e.key)){vals[i]=(vals[i]==="0"?e.key:vals[i]+e.key).slice(0,10);saveDraft();render()}else if(e.key==="."||e.key===","){if(!vals[i].includes("."))vals[i]=vals[i]||"0",vals[i]+=".";saveDraft();render()}else if(e.key==="-"){neg[i]=!neg[i];saveDraft();render()}});
renderMeta();
if(TEST_MODE){
  $("testBadge").style.display="block";
  $("reviewBtn").title="Mode test browser";
}else{
  $("testBadge").style.display="none";
  tg?.MainButton?.hide();
}
restoreDraft();
render();showReview(false);
})();
</script>
</body>
</html>
